[build-system]
requires = ["setuptools>=61"]

build-backend = "setuptools.build_meta"

[project]
name = "bashlex"
version = "0.1.0"
description = "Bash command line parser"
readme = "README.md"
requires-python = "~=3.12"

dependencies = []

[tool.setuptools]
packages = ["bashlex"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "pyright>=1.1.400",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "--disable-warnings",
    "-p no:warnings",
    "-p no:cacheprovider",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["bashlex"]
exclude = ["**/__pycache__"]

# Basic configuration
reportMissingImports = true
reportMissingTypeStubs = false

# Type checking mode
typeCheckingMode = "basic" # Use "basic" instead of "strict" for this codebase

# Enable these useful checks
reportPrivateUsage = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryCast = "error"
